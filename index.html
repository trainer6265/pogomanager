<style id="css">
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2030;--sub:#6b7085;--line:#e3e5ee;--acc:#3b5bdb;--acc2:#e8edff;--bad:#d6336c;--good:#2b8a3e}
@media (prefers-color-scheme:dark){:root{--bg:#14161f;--card:#1e2130;--ink:#eef0f7;--sub:#9aa0b8;--line:#2d3146;--acc:#7b93ff;--acc2:#262d4d;--bad:#ff6b9a;--good:#69db7c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 0;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 2px}
.status{font-size:12px;color:var(--sub);margin-bottom:8px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;padding:8px 12px;border-radius:10px 10px 0 0;color:var(--sub);text-decoration:none;font-weight:600;font-size:14px}
nav a.on{color:var(--acc);background:var(--card);box-shadow:inset 0 -3px 0 var(--acc)}
main{padding:14px;max-width:760px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:120px;font-size:12px;font-family:ui-monospace,monospace}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px;font-weight:600}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;background:var(--acc2);color:var(--acc);cursor:pointer}
button.pri{background:var(--acc);color:#fff}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.sm{padding:6px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.mon{cursor:pointer;padding-left:16px}
.mon .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.mon .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mon .nm{font-weight:700;font-size:16px}
.cp{font-weight:800;font-size:16px;white-space:nowrap}
.cp small{font-size:11px;color:var(--sub);font-weight:600;margin-right:2px}
.mv{font-size:13px;color:var(--sub);margin-top:4px}
.chip{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:2px 8px;margin:4px 4px 0 0;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.shadow{background:#5f3dc4;color:#fff}.tag{background:var(--acc2);color:var(--acc)}.maxb{background:linear-gradient(90deg,#e8590c,#c2255c);color:#fff}.tmg{background:#fff3bf;color:#a15c00}@media (prefers-color-scheme:dark){.tmg{background:#4a3a10;color:#ffd43b}}.fav{color:#f59f00}
.muted{color:var(--sub);font-size:13px}
.empty{text-align:center;padding:30px 10px;color:var(--sub)}
.sec{font-size:15px;font-weight:800;margin:18px 0 8px}
.team{border:2px solid var(--acc)}
.team h3{margin:0 0 6px;font-size:15px}
.slot{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.role{flex:none;font-size:11px;font-weight:800;background:var(--acc2);color:var(--acc);border-radius:6px;padding:2px 6px;margin-top:2px}
.good{color:var(--good)}.bad{color:var(--bad)}
.rank{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px}
@media(min-width:600px){.modalbg{align-items:center}.modal{border-radius:18px}}
.modal h2{margin:0 0 4px;font-size:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns button{flex:1}
.hist{font-size:13px;border-left:3px solid var(--line);padding-left:10px;margin-top:6px}
.hist div{margin:4px 0}
.hist time{color:var(--sub);font-size:11px;margin-right:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.custom{background:var(--acc2);border-radius:12px;padding:4px 10px 10px;margin-top:8px}
.opp{display:inline-flex;align-items:center;gap:4px;background:var(--acc2);border-radius:999px;padding:4px 6px 4px 10px;margin:4px 4px 0 0;font-size:13px;font-weight:600}
.opp button{padding:0 6px;background:transparent;font-size:16px;line-height:1}

function isElite(sp,n){var l=LS[sp];return !!l&&l.fast.concat(l.ch).some(function(x){return x.n===n&&x.elite})}
function tmName(sp,n){var el=isElite(sp,n),f=MOVES[n]&&MOVES[n].kind==='fast';return el?'대단한 기술머신':(f?'노말 기술머신':'스페셜 기술머신')}
function lab(sp,n,mode){var el=isElite(sp,n),b='';
 if(mode==='tm')b=tmName(sp,n);else if(mode==='unlock')b=el?'해방 후 대단한 기술머신 필요':'';else b=el?'이벤트 한정':'';

function bestOf(list,my,defs){return list.map(function(x){return {n:x.n,elite:x.elite,v:moveMult(x.n,my,defs)}}).sort(function(a,b){return b.v-a.v||(a.elite?1:0)-(b.elite?1:0)})}

function moveAdvice(x,opps){var sp=x.m.species,L=LS[sp];if(!L||!x.st)return null;var my=x.st.types;
 var cur={fast:x.m.fast,ch:(x.m.charged||[]).filter(Boolean)};var out=[],unlock=null;
 opps.forEach(function(o){if(matchup(x,o).v>=1.3)return;var nm=esc(o.name);
  var bf=bestOf(L.fast,my,o.types)[0];var cf=cur.fast?moveMult(cur.fast,my,o.types):0;
  if(bf&&bf.n!==cur.fast&&bf.v>cf*1.01&&eff(mt(bf.n),o.types)>1)out.push('vs '+nm+': 노말어택 '+esc(cur.fast||'-')+' → <b>'+lab(sp,bf.n,'tm')+'</b>');
  var cb=cur.ch.length?Math.max.apply(null,cur.ch.map(function(n){return moveMult(n,my,o.types)})):0;
  var bc=bestOf(L.ch,my,o.types).filter(function(c){return cur.ch.indexOf(c.n)<0})[0];
  if(bc&&bc.v>cb*1.01&&eff(mt(bc.n),o.types)>1){
   if(cur.ch.length<2)unlock='vs '+nm+': 두 번째 스페셜어택으로 <b>'+lab(sp,bc.n,'unlock')+'</b> 해방을 추천해요.';
   else{var worst=cur.ch.slice().sort(function(a,b){return moveMult(a,my,o.types)-moveMult(b,my,o.types)})[0];out.push('vs '+nm+': 스페셜어택 '+esc(worst)+' → <b>'+lab(sp,bc.n,'tm')+'</b>')}}});
 if(!out.length&&!unlock){var R=L.rec;
  if(R.fast&&cur.fast!==R.fast)out.push('노말어택 '+esc(cur.fast||'-')+' → <b>'+lab(sp,R.fast,'tm')+'</b> (추천 세트)');
  var miss=R.ch.filter(function(n){return cur.ch.indexOf(n)<0});
  if(miss.length){if(cur.ch.length<2)unlock=(cur.ch.length?'두 번째 스페셜어택으로 ':'스페셜어택으로 ')+'<b>'+miss.map(function(n){return lab(sp,n,'unlock')}).join('</b> 또는 <b>')+'</b> 해방을 추천해요 (추천 세트).';
   else{var notRec=cur.ch.filter(function(n){return R.ch.indexOf(n)<0});if(notRec.length)out.push('스페셜어택 '+esc(notRec[0])+' → <b>'+lab(sp,miss[0],'tm')+'</b> (추천 세트)')}}}
 return {tm:out,unlock:unlock}}
function recLine(sp){var L=LS[sp];if(!L)return '';return [L.rec.fast].concat(L.rec.ch).map(function(n){return lab(sp,n)}).join(' · ')}

var STAR_AVG=[3.7,8.7,11,13.5,15];
function starsOf(iv){var t=iv[0]+iv[1]+iv[2];return t>=45?4:t>=37?3:t>=30?2:t>=23?1:0}
function ivOf(m){if(m.iv)return m.iv;if(m.stars!=null&&m.stars!==''){var a=STAR_AVG[+m.stars];return [a,a,a]}return [15,15,15]}
function monStars(m){return m.iv?starsOf(m.iv):(m.stars!=null&&m.stars!==''?+m.stars:null)}
function starBadge(m,big){var n=monStars(m);if(n==null)return '';var t=n===4?'★★★':(n?'★'.repeat(n):'☆');
 return '<span class="stars'+(n===4?' hundo':'')+'" style="font-size:'+(big?16:13)+'px" title="'+(n===4?'100%':n+'성')+'">'+t+(n===4?'<small>100%</small>':'')+'</span>'}
function stats(m){var sp=SP[m.species];if(!sp||!m.cp)return null;
 var iv=ivOf(m);var A=sp.a+iv[0],D=sp.d+iv[1],H=sp.s+iv[2];
 var cpm=Math.sqrt(Math.max(10,m.cp)*10/(A*Math.sqrt(D)*Math.sqrt(H)));
 var atk=A*cpm,def=D*cpm,hp=Math.max(10,Math.floor(H*cpm));
 if(m.shadow){atk*=1.2;def*=0.8333}
 return {atk:atk,def:def,hp:hp,prod:atk*def*hp,types:sp.t}}
function moveMult(n,my,defs){var t=mt(n);if(!t)return 0;return eff(t,defs)*(my.indexOf(t)>=0?1.2:1)}
function counter(m,defs){var st=stats(m);if(!st)return null;
 var fm=m.fast?moveMult(m.fast,st.types,defs):0.7;
 var best=null;(m.charged||[]).filter(Boolean).forEach(function(c){var v=moveMult(c,st.types,defs);if(!best||v>best.v)best={c:c,v:v}});
 var cm=best?best.v:0.7;
 var inc=Math.max.apply(null,defs.map(function(t){return eff(t,st.types)}));
 var off=st.atk*(0.55*fm+0.45*cm);
 var score=off*Math.pow(Math.sqrt(st.def*st.hp),0.25)/Math.pow(inc,0.5);
 return {m:m,st:st,score:score,fm:fm,cm:cm,bestC:best&&best.c,inc:inc,fastSE:m.fast&&eff(mt(m.fast)||'노말',defs)>1,chargedSE:best&&eff(mt(best.c),defs)>1}}
function reasons(r,defs){var o=[];
 if(r.fastSE)o.push('<span class="good">노말어택 '+esc(r.m.fast)+' 효과 굉장함</span>');
 if(r.chargedSE)o.push('<span class="good">스페셜어택 '+esc(r.bestC)+' 효과 굉장함</span>');
 if(!r.fastSE&&!r.chargedSE)o.push('<span class="bad">상성 좋은 기술 없음 · 기술 변경 고려</span>');
 if(r.inc<1)o.push('<span class="good">상대 공격에 강함</span>');else if(r.inc>1)o.push('<span class="bad">상대 공격에 약함</span>');
 return o.join(' · ')}

 var atk=pool.slice().sort(function(a,b){return b.atkScore-a.atkScore}),tank=pool.slice().sort(function(a,b){return b.tankScore-a.tankScore});

/* ---------- CSV 불러오기 (Calcy IV 등) ---------- */
function parseCSV(text){text=text.replace(/^﻿/,'');var first=text.split(/\r?\n/)[0]||'';
 var delim=[',',';','\t'].map(function(d){return [d,first.split(d).length]}).sort(function(a,b){return b[1]-a[1]})[0][0];
 var rows=[],row=[],f='',q=false;
 for(var i=0;i<text.length;i++){var ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===delim){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
 if(f||row.length){row.push(f);rows.push(row)}
 return rows.filter(function(r){return r.some(function(x){return x.trim()})})}
function findCol(hs,test){for(var i=0;i<hs.length;i++)if(test(hs[i]))return i;return -1}
function resolveSpecies(name,dex,form){name=(name||'').trim();if(SP[name])return name;
 var n=norm(name),cands=SPLIST.filter(function(e){return e.ko===name||(n&&e.en===n)||norm(e.ko)===n||(dex&&e.dex===dex)});
 if(!cands.length)return null;var d=cands[0].dex;var vars=SPLIST.filter(function(e){return e.dex===d});
 var ft=norm(form+' '+name);
 var hit=vars.filter(function(e){return e.forms.some(function(k){return k&&ft.indexOf(k)>=0})})[0];
 if(hit)return hit.ko;var base=vars.filter(function(e){return !e.forms.length})[0];return (base||vars[0]).ko}
function resolveMove(n){n=(n||'').trim();if(!n||n==='-')return '';if(MOVES[n])return n;var k=norm(n);if(MOVE_EN[k])return MOVE_EN[k];
 for(var name in MOVES)if(norm(name)===k)return name;return n}
function importCSV(text){var rows=parseCSV(text);if(rows.length<2)return {err:'표 형식의 내용을 찾지 못했어요.'};
 var hs=rows[0].map(function(h){return h.trim().toLowerCase()});
 var cName=findCol(hs,function(h){return ['name','pokemon','pokémon','species','이름','포켓몬'].indexOf(h)>=0});
 var cNr=findCol(hs,function(h){return ['nr','#','dex','no','pokedex','pokedex #','도감번호','번호'].indexOf(h)>=0});
 var cCP=findCol(hs,function(h){return h==='cp'});
 var cForm=findCol(hs,function(h){return (h==='form'||h==='폼'||h==='form name')});
 var cFast=findCol(hs,function(h){return /fast|quick move|빠른/.test(h)&&!/id\)?$|\(id/.test(h)});
 var cCh=[];hs.forEach(function(h,i){if(/special|charge|차지/.test(h)&&!/fast|빠른/.test(h)&&!/\(id\)|\bid\b/.test(h))cCh.push(i)});
 function ivCol(re){var c=hs.map(function(h,i){return [h,i]}).filter(function(x){return re.test(x[0])&&/iv|개체/.test(x[0])&&!/min|max|%/.test(x[0])});return c.length?c[0][1]:-1}
 var cA=ivCol(/att|atk|공격/),cD=ivCol(/def|방어/),cH=ivCol(/hp|sta|체력/);
 var cSh=findCol(hs,function(h){return /shadow|섀도/.test(h)});
 if(cName<0&&cNr<0)return {err:'포켓몬 이름(Name) 열을 찾지 못했어요.'};
 if(cCP<0)return {err:'CP 열을 찾지 못했어요.'};
 var t=now(),mons=[],unkSp={},unkMv={};
 rows.slice(1).forEach(function(r){var g=function(c){return c>=0&&r[c]!=null?String(r[c]).trim():''};
  var raw=g(cName),dex=parseInt(g(cNr),10)||0,cp=parseInt(g(cCP),10);if(!(cp>=10))return;
  var sp=resolveSpecies(raw,dex,g(cForm));if(!sp){sp=raw||('#'+dex);unkSp[sp]=1}
  var fast=resolveMove(g(cFast));if(fast&&!MOVES[fast])unkMv[fast]=1;
  var ch=cCh.map(function(c){return resolveMove(g(c))}).filter(Boolean).slice(0,2);ch.forEach(function(n){if(!MOVES[n])unkMv[n]=1});
  var iv=[g(cA),g(cD),g(cH)];iv=iv.every(function(v){return v!==''&&!isNaN(parseFloat(v))})?iv.map(function(v){return Math.max(0,Math.min(15,Math.round(parseFloat(v))))}):null;
  var sv=g(cSh).toLowerCase(),isForm=cSh>=0&&/form/.test(hs[cSh]);
  var shadow=(/shadow|섀도/.test(sv)&&!/non|not/.test(sv))||(isForm&&sv==='2')||(!isForm&&['1','true','yes','y','o'].indexOf(sv)>=0);
  mons.push({id:uid(),species:sp,cp:cp,fast:fast,charged:ch,shadow:shadow,iv:iv,fav:false,note:'',created:t,updated:t,hist:[{t:t,x:'CSV 불러오기 · CP '+cp}]})});
 if(!mons.length)return {err:'불러올 포켓몬이 없어요. CP 값이 들어 있는지 확인해 주세요.'};
 return {mons:mons,unkSp:Object.keys(unkSp),unkMv:Object.keys(unkMv)}}

function moveOpts(kind,types,sel,sp){var all=Object.keys(MOVES).filter(function(n){return MOVES[n].kind===kind});

  if(sel&&!MOVES[sel])h0+='<option selected value="'+esc(sel)+'">'+esc(sel)+' (미등록)</option>';return h0}
 var stab=all.filter(function(n){return types.indexOf(MOVES[n].type)>=0}).sort();

 if(stab.length)h+='<optgroup label="★ 타입 일치">'+stab.map(function(n){return '<option value="'+esc(n)+'"'+(n===sel?' selected':'')+'>★ '+esc(n)+' ('+MOVES[n].type+')</option>'}).join('')+'</optgroup>';

 if(sel&&!MOVES[sel])h+='<option selected value="'+esc(sel)+'">'+esc(sel)+' (미등록)</option>';

function monForm(mode,m,flash){m=m||{};var title={add:'포켓몬 추가',edit:'정보 수정',evolve:'진화',power:'강화',moves:'기술 변경'}[mode];

  h+='<label>맥스 포켓몬 (맥스배틀용)</label><select id="f_max">'+[['','아니요'],['dyna','다이맥스'],['giga','거다이맥스']].map(function(o){return '<option value="'+o[0]+'"'+((m.max||'')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>';
  h+='<label>개체값 IV (선택 · 공/방/체 0~15)</label><div class="grid3"><input id="f_i0" type="number" inputmode="numeric" value="'+iv[0]+'" placeholder="공"><input id="f_i1" type="number" inputmode="numeric" value="'+iv[1]+'" placeholder="방"><input id="f_i2" type="number" inputmode="numeric" value="'+iv[2]+'" placeholder="체"></div><div class="muted" id="f_ivst" style="margin-top:4px"></div>';
  var stv=(m.stars!=null&&m.stars!=='')?String(m.stars):'';
  h+='<label>별 (공·방·체를 모를 때만)</label><select id="f_st">'+[['','모름'],['0','☆ 0개'],['1','★ 1개'],['2','★★ 2개'],['3','★★★ 3개'],['4','★★★ 100% (빨간 별)']].map(function(o){return '<option value="'+o[0]+'"'+(stv===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>';
  h+='<label>메모 (선택)</label><input id="f_note" value="'+esc(m.note||'')+'" placeholder="예: 커뮤데이 기술, 슈퍼리그용">'}
 h+='<div class="muted" id="f_err" style="color:var(--bad)"></div><div class="btns"><button data-x="cancel">취소</button>'+(mode==='add'?'<button data-x="more">저장 후 계속</button>':'')+'<button class="pri" data-x="ok">저장</button></div>';
 if(flash)h=h.replace('<h2>','<div class="note" style="margin-top:0;color:var(--good);font-weight:700">✓ '+esc(flash)+'</div><h2>');
 openModal(h,function(bg){var $=function(id){return bg.querySelector('#'+id)};
  function curTypes(){var n=showSpecies?$('f_sp').value.trim():m.species;if(SP[n])return SP[n].t;var t1=$('f_ct1'),t2=$('f_ct2');return t1?[t1.value,t2.value].filter(Boolean):[]}
  function refreshMoves(){if(!showMoves)return;var t=curTypes();var c=m.charged||[];var spn=showSpecies?$('f_sp').value.trim():m.species;
   $('f_fast').innerHTML=moveOpts('fast',t,$('f_fast').value||m.fast,spn);$('f_c1').innerHTML=moveOpts('charged',t,$('f_c1').value||c[0],spn);$('f_c2').innerHTML=moveOpts('charged',t,$('f_c2').value||c[1],spn)}
  function refreshCustom(){if(!showSpecies)return;var n=$('f_sp').value.trim();var box=$('f_custom');
   if(!n||SP[n]){box.innerHTML='';refreshMoves();return}
   refreshMoves();
   if(box.innerHTML)return;
   box.innerHTML='<div class="custom"><label>도감에 없는 이름이에요. 새로 등록할게요.</label><div class="grid2">'+typeSel('f_ct1','','타입 1')+typeSel('f_ct2','','타입 2 (없음)')+'</div><label>종족값 (모르면 비워두세요)</label><div class="grid3"><input id="f_ca" type="number" placeholder="공격"><input id="f_cd" type="number" placeholder="방어"><input id="f_cs" type="number" placeholder="체력"></div></div>';
   $('f_ct1').addEventListener('change',refreshMoves);$('f_ct2').addEventListener('change',refreshMoves);refreshMoves()}
  if(showSpecies){$('f_sp').addEventListener('input',refreshCustom);$('f_sp').addEventListener('change',refreshCustom)}
  refreshMoves();
  function ivLive(){var a=$('f_i0'),b=$('f_i1'),c=$('f_i2'),out=$('f_ivst'),st=$('f_st');if(!a||!out)return;var v=[a.value,b.value,c.value];
   if(v.every(function(x){return x!==''})){var iv=v.map(function(x){return Math.max(0,Math.min(15,+x))});var n=starsOf(iv),t=iv[0]+iv[1]+iv[2];
    out.innerHTML='→ '+starBadge({iv:iv})+' 합계 '+t+' ('+Math.round(t/45*100)+'%)';st.disabled=true;st.value=String(n)}
   else{out.textContent='';st.disabled=false}}
  ['f_i0','f_i1','f_i2'].forEach(function(id){var el=$(id);if(el)el.addEventListener('input',ivLive)});ivLive();
  bg.addEventListener('click',function(e){var x=e.target.getAttribute('data-x');if(x==='cancel')closeModal();if(x==='ok')submit(false);if(x==='more')submit(true)});
  function submit(more){var err=$('f_err');var o={};
   if(showSpecies){var n=$('f_sp').value.trim();if(!n){err.textContent='포켓몬 이름을 입력하세요.';return}
    if(!SP[n]){var t1=$('f_ct1').value,t2=$('f_ct2').value;if(!t1){err.textContent='새 포켓몬의 타입을 골라 주세요.';return}
     var cs={name:n,t:[t1,t2].filter(function(v,i,a){return v&&a.indexOf(v)===i}),a:+$('f_ca').value||150,d:+$('f_cd').value||150,s:+$('f_cs').value||150};S.customSpecies.push(cs);applyCustom()}
    o.species=n}
   if(showCP){var cp=parseInt($('f_cp').value,10);if(!(cp>=10)){err.textContent='CP를 입력하세요.';return}o.cp=cp}
   if(showMoves){o.fast=$('f_fast').value;o.charged=[$('f_c1').value,$('f_c2').value].filter(Boolean)}
   if(showMisc){o.shadow=$('f_sh').checked;o.max=$('f_max').value;var iv=[$('f_i0').value,$('f_i1').value,$('f_i2').value];o.stars=$('f_st').value===''?null:+$('f_st').value;o.iv=iv.every(function(v){return v!==''})?iv.map(function(v){return Math.max(0,Math.min(15,+v))}):null;if(o.iv)o.stars=starsOf(o.iv);o.note=$('f_note').value.trim()}
   commit(mode,m,o);closeModal();render();if(mode!=='add')openDetail(m.id);else if(more){monForm('add',null,(o.shadow?'섀도 ':'')+o.species+' 저장됨 · 지금 '+S.mons.length+'마리');var sp=document.getElementById('f_sp');if(sp)sp.focus()}}
 })}
function commit(mode,m,o){var t=now(),log;
 if(mode==='add'){var nm=Object.assign({id:uid(),fav:false,hist:[],created:t},o);nm.updated=t;nm.hist.push({t:t,x:'등록 · CP '+o.cp});S.mons.push(nm);save();return}
 if(mode==='power')log='강화 · CP '+m.cp+' → '+o.cp;
 if(mode==='evolve')log='진화 · '+m.species+' → '+o.species+' (CP '+m.cp+' → '+o.cp+')';
 if(mode==='moves'){var ch=[];if(o.fast!==m.fast)ch.push('빠른 '+(m.fast||'-')+' → '+(o.fast||'-'));var a=(m.charged||[]).join('/'),b=o.charged.join('/');if(a!==b)ch.push('차지 '+(a||'-')+' → '+(b||'-'));log='기술 변경 · '+(ch.join(', ')||'변경 없음')}
 if(mode==='edit')log='정보 수정';
 Object.assign(m,o);m.updated=t;m.hist=m.hist||[];m.hist.push({t:t,x:log});save()}

function openDetail(id){var m=findMon(id);if(!m)return;var sp=SP[m.species];var st=stats(m);
 var h='<div class="mrow" style="margin-bottom:6px">'+avatar(m,64)+'<div class="grow"><h2>'+(m.fav?'<span class="fav">★</span> ':'')+esc(m.species)+(m.shadow?'<span class="badge shadow">섀도</span>':'')+maxBadge(m)+'</h2><div>'+(sp?sp.t.map(chip).join(''):'')+'</div></div></div>';
 h+='<div style="margin-top:8px"><b style="font-size:22px">CP '+m.cp+'</b> '+starBadge(m,true)+(m.iv?' <span class="muted">IV '+m.iv.join('/')+'</span>':(m.stars!=null?' <span class="muted">(별만 입력)</span>':''))+'</div>';
 h+='<div class="mv">노말어택: '+mvLabel(m.fast)+'<br>스페셜어택: '+((m.charged||[]).filter(Boolean).map(mvLabel).join(' / ')||'-')+'</div>';
 if(m.note)h+='<div class="note">'+esc(m.note)+'</div>';
 var lg=[];if(m.cp<=1500)lg.push('슈퍼');if(m.cp<=2500)lg.push('하이퍼');lg.push('마스터');
 h+='<div class="muted" style="margin-top:6px">출전 가능: '+lg.join(' · ')+' 리그</div>';

 if(LS[m.species]&&st){var adv=moveAdvice({m:m,st:st},[]);h+='<div class="note"><b>👍 추천 기술 세트</b><br>'+recLine(m.species)+((adv.tm.length||adv.unlock)?'<br><br><b>바꾸면 좋은 기술</b>'+adv.tm.concat(adv.unlock?[adv.unlock]:[]).map(function(l){return '<br>• '+l}).join(''):'<br><span class="good">지금 기술이 추천 세트와 같아요 ✓</span>')+'</div>'}
 h+='<div class="btns"><button class="pri" data-y="power">강화</button><button class="pri" data-y="evolve">진화</button><button class="pri" data-y="moves">기술 변경</button></div>';
 h+='<div class="btns"><button data-y="edit">정보 수정</button><button data-y="fav">'+(m.fav?'즐겨찾기 해제':'즐겨찾기')+'</button><button class="danger" data-y="del">삭제</button></div>';
 h+='<div class="sec">변경 기록</div><div class="hist">'+((m.hist||[]).slice().reverse().map(function(e){return '<div><time>'+fmtDate(e.t)+'</time>'+esc(e.x)+'</div>'}).join('')||'<div class="muted">기록 없음</div>')+'</div>';
 h+='<div class="btns"><button data-y="close">닫기</button></div>';
 openModal(h,function(bg){var delArm=false;bg.addEventListener('click',function(e){var y=e.target.getAttribute('data-y');if(!y)return;
